{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Hunt | ECU Scavenger Hunt</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style_css/style.css' %}">
</head>

<body class="start-page">

<main class="container">

    <div class="hunt-top"><img src="{% static 'style_css/ecu-logo-black.png' %}" class="ecu-logo">

        <div class="clock-display"><span id="clock"></span></div>
    </div>

    <div class="header-accent"></div>

    <div class="start-content">

        <h1>Delete Hunt</h1>

        <p class="welcome-text start-text">Are you sure you want to delete this hunt?</p>

        <form method="POST">
            {% csrf_token %}

            <p style="font-size: 18px;"><strong>Name:</strong> {{ hunt.hunt_name }}</p>

            <p style="font-size: 18px;"><strong>Location:</strong> {{ hunt.location }}</p>

            <button type="submit" style="background-color: rgb(233, 35, 5); color: white; font-size: 17px;"
                   onmouseover="this.style.backgroundColor='red'"
                   onmouseout="this.style.backgroundColor='rgb(233, 35, 5)'">Confirm Delete</button>
        </form>

        <p class="welcome-text" style="margin-top: 20px; margin-bottom: 0;">
            <a href="{% url 'manage_hunts' %}" class="back-link">Back to Manage Hunts</a>
        </p>

    </div>

</main>

<script src="{% static 'style_css/questions-page.js' %}"></script>

</body>
</html>
