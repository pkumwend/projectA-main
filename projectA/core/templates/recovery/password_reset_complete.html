{% extends "recovery/base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
    <h1>Password Reset Complete</h1>

    <div class="recovery-notice" role="status">
        <p>Your password has been changed successfully.</p>
    </div>

    <p class="welcome-text start-text recovery-copy">
        You can now log in with your username and new password.
    </p>

    <a href="{{ recovery_login_url }}" class="recovery-button">Back to Staff Login</a>
{% endblock %}
