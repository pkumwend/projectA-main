{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">

    <title>{% block title %}Password Recovery{% endblock %} | ECU Scavenger Hunt</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style_css/style.css' %}">
    <link rel="stylesheet" href="{% static 'recovery/recovery.css' %}">
</head>

<body class="start-page recovery-page">

<main class="container">

    <div class="hunt-top">

        <img src="{% static 'style_css/ecu-logo-black.png' %}" class="ecu-logo" alt="Edith Cowan University">

        <div class="clock-display"><span id="clock"></span>
        </div>

    </div>

    <div class="header-accent"></div>

    <div class="start-content">
        {% block content %}{% endblock %}
    </div>

</main>

<script src="{% static 'style_css/questions-page.js' %}"></script>

</body>
</html>
