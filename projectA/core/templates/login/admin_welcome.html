{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | ECU Scavenger Hunt</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'style_css/style.css' %}">
</head>

<body class="start-page">

    <main class="container start-container">

        <!-- Black header -->
        <div class="hunt-top">

            <img src="{% static 'ecu-logo-black.png' %}"
                 alt="Edith Cowan University Logo"
                 class="ecu-logo">

            <div class="clock-display">
                <span id="clock"></span>
            </div>

        </div>

        <!-- Teal line -->
        <div class="header-accent"></div>

        <!-- Dashboard content -->
        <div class="start-content">

            <h1>ECU Scavenger Hunt</h1>

            <div class="group-section">
                Administrator Portal
            </div>

            <h2>Welcome, {{ user.username }}</h2>

            <p class="welcome-text">
                You are logged in as an administrator.
            </p>

            <!-- Django messages -->
            {% if messages %}
                {% for message in messages %}
                    <p class="message {{ message.tags }}" role="alert">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}

            <!-- Logout form -->
            <form method="post"
                  action="{% url 'staff_logout' %}">
                {% csrf_token %}

                <button type="submit" class="logout-button">
                    Logout
                </button>

            </form>

        </div>

    </main>

    <!-- Clock -->
    <script>
        function updateClock() {
            const currentTime = new Date();

            const formattedTime =
                currentTime.toLocaleTimeString("en-AU", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                });

            document.getElementById("clock").textContent =
                formattedTime.toUpperCase();
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>

</html>
