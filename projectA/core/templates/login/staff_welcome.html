{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard | ECU Scavenger Hunt</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style_css/style.css' %}">
</head>

<body class="start-page">

<main class="container">

    <div class="hunt-top">
        <img src="{% static 'style_css/ecu-logo-black.png' %}" class="ecu-logo">

        <div class="clock-display"><span id="clock"></span></div>
    </div>

    <div class="header-accent"></div>

    <div class="start-content">

        <h1>Welcome, {{ user.username }}</h1>

        <p class="welcome-text start-text">You are logged in as a staff member</p>

        {% if messages %}
            {% for message in messages %}
                <p class="message {{ message.tags }}" role="alert">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <a href="{% url 'manage_hunts' %}" class="button-link">Manage Hunts</a>

        <a href="{% url 'question_pool' %}" class="button-link">Question Pool</a>

        <a href="{% url 'manage_sessions' %}" class="button-link">Manage Sessions</a>

        <form method="post" action="{% url 'staff_logout' %}">
            {% csrf_token %}

            <button type="submit">Logout</button>
        </form>

    </div>

</main>

<script src="{% static 'style_css/questions-page.js' %}"></script>

</body>
</html>
