{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Session | Ecu scavenger Hunt</title>

<link
    rel="stylesheet"
    href="{% static 'style_css/style.css' %}"
>

</head>

<body>

<main class="container">

<h1>Delete Session</h1>

<div class="accent-line"></div>

<form method="POST">
    {% csrf_token %}
    <p>
    Name : {{ Session.hunt.hunt_name }}
    </p>
    <p>
    Location : {{ Session.hunt.location  }}
    </p>
    <button type="submit", style="color: crimson;">
        Confirm?
    </button>
</form>
<p>
<a href="{% url 'manage_sessions' %}">
    Back to Manage Sessions
</a>
</p>

</main>

</body>
</html>
