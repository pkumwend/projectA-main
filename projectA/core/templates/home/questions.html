<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- mobile responsiveness -->
    <title>ECU Scavenger Hunt - Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"> <!-- google font -->
    <link rel="stylesheet" href="style.css"> <!-- main stylesheet -->
</head>

<body>
    <header class="sticky-header"> <!-- sticky ecu header -->
        <div class="hunt-top">
            <img src="ecu-logo-black.png" alt="Edith Cowan University Logo" class="ecu-logo"> <!-- ecu logo -->
            <div class="clock-display"><span id="clock"></span></div> <!-- clock display -->
        </div>
        <div class="header-accent"></div> <!-- teal divider -->
    </header>

    <main class="container questions-container"> <!-- questions page container -->
        <div class="questions-content">
            <h1>ECU Scavenger Hunt</h1> <!-- page heading -->

            <div class="group-section">Welcome, <span id="groupDisplay">Team Name</span></div> <!-- display team name -->

            <h2>Your Hunt Begins Now!</h2>
            <p class="welcome-text">Explore the campus and complete the challenges below 🏁</p>

            <section class="question-row"> <!-- short answer question -->
                <div class="question-content"><p><strong>How much is coffee at Building 10? ☕️</strong></p>
                </div>

                <div class="answer-content"> <!-- text answer input -->
                    <label for="question1"></label><input type="text" id="question1" name="question1" placeholder="Enter your answer">
                </div>
            </section>

            <section class="question-row"> <!-- photo question -->
                <div class="question-content"><p><strong>Find Building 12 and take a photo 📸</strong></p>
                </div>

                <div class="answer-content"> <!-- photo upload input -->
                    <label for="photo">Upload Photo</label><input type="file" id="photo" name="photo" accept="image/*">
                </div>
            </section>

            <button type="button" class="submit-button">Submit Answers</button> <!-- submit answers -->
        </div>
    </main>

    <script src="{% static 'style_css/questions-page.js' %}"></script> <!-- page javascript -->
</body>
</html>
