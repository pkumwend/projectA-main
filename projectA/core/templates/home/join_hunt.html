
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style_css/style.css' %}">
</head>

<body class="start-page">
<main class="container">

    <div class="hunt-top">
        <img src="{% static 'style_css/ecu-logo-black.png' %}" alt="Edith Cowan University Logo" class="ecu-logo">
        <div class="clock-display"><span id="clock"></span></div>
    </div>

    <div class="header-accent"></div>

    <div class="start-content">
        <h1>Enter Your Team Name</h1>
        <p class="welcome-text">Choose a name for your team to begin the scavenger hunt!</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Continue</button>
        </form>
    </div>

</main>

<script src="{% static 'style_css/questions-page.js' %}"></script>
</body>
</html>
