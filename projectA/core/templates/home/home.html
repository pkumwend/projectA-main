{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | ECU Scavenger Hunt</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'style_css/style.css' %}">

    <style>
        /* Centre the notification messages */
        .start-content .message {
            justify-content: center;
            text-align: center;
        }

        /* Arrange the administrator dashboard buttons */
        .start-content .dashboard-actions {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 16px;
        }

        /* Align the Logout form with the dashboard buttons */
        .start-content .logout-form {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /*  Apply the same style to the dashboard buttons and Logout */
        .start-content .dashboard-button,
        .start-content .logout-button {
            display: block;
            box-sizing: border-box;
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 6px;
            background-color: #000000;
            color: #FFFFFF;

            font: bold 17px Barlow, sans-serif;
            line-height: 1.3;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .start-content .dashboard-button:hover,
        .start-content .logout-button:hover {
            background-color: #222222;
        }

        .start-content .dashboard-button:focus-visible,
        .start-content .logout-button:focus-visible {
            outline: 3px solid #26B298;
            outline-offset: 3px;
        }
        /* Set the background and text colours of the dashboard buttons. */
        .start-content .dashboard-button {
            background-color: #25B197;
            color: #000000;
        }

        /* Darken the background when hovering over a dashboard button. */
        .start-content .dashboard-button:hover {
            background-color: #1D957F;
        }

        /* Show when staff management has not been connected yet. */
        .start-content .dashboard-button:disabled {
            background-color: #DCE6E1;
            color: #52615A;
            cursor: not-allowed;
        }

        .start-content .dashboard-note {
            margin: -4px 0 4px;
            color: #555555;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body class="start-page">
    <main class="container">

        <!-- ECU logo and clock -->
        <div class="hunt-top">
            <img src="{% static 'style_css/ecu-logo-black.png' %}"
                 alt="Edith Cowan University Logo"
                 class="ecu-logo">

            <div class="clock-display">
                <span id="clock"></span>
            </div>
        </div>

        <!-- Teal line -->
        <div class="header-accent"></div>

        <div class="start-content">
            <h1>Welcome!</h1>

            <p class="welcome-text">
                Welcome to the scavenger hunt!
            </p>

            <h2>Join a Quiz</h2>
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Join Quiz
                </button>

            </form>
        </div>

    </main>
    <!-- Clock -->
    <script>
        function updateClock() {
            const currentTime = new Date();

            const formattedTime =
                currentTime.toLocaleTimeString("en-AU", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                });

            document.getElementById("clock").textContent =
                formattedTime.toUpperCase();
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
