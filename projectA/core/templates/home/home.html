
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | ECU Scavenger Hunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style_css/style.css' %}">

    <style>
        /* Centre the notification messages */
        .start-content .message {
            justify-content: center;
            text-align: center;
        }
    </style>
</head>

<body class="start-page">
<main class="container">

    <!-- ECU logo and clock -->
    <div class="hunt-top">
        <img src="{% static 'style_css/ecu-logo-black.png' %}" alt="Edith Cowan University Logo" class="ecu-logo">
        <div class="clock-display"><span id="clock"></span></div>
    </div>

    <!-- Teal line -->
    <div class="header-accent"></div>

    <div class="start-content">
        <h1>Welcome to the ECU Scavenger Hunt!</h1>
        <p class="welcome-text">Enter your join code to get started!</p>

        {% if messages %}
            {% for message in messages %}
            <p class="error-message" role="alert">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Join Quiz</button>
        </form>
    </div>

</main>

<script src="{% static 'style_css/questions-page.js' %}"></script>
</body>
</html>
