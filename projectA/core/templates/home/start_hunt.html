{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ hunt.hunt_name }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link
        rel="stylesheet"
        href="{% static 'style_css/style.css' %}"
    >
</head>

<body class="start-page">

    <main class="container">

        <!-- ECU logo and clock -->
        <div class="hunt-top">
            <img src="{% static 'style_css/ecu-logo-black.png' %}"
                 alt="Edith Cowan University Logo"
                 class="ecu-logo">

            <div class="clock-display">
                <span id="clock"></span>
            </div>
        </div>

        <!-- Teal line -->
        <div class="header-accent"></div>

        <div class="start-content">
            <h1>{{ hunt.hunt_name }}</h1>

            <p>
                Welcome {{ player.name }}!
            </p>

            <p>
                Location: {{ hunt.location }}
            </p>

            <h2>Questions</h2>

            {% for question in questions %}
                <section class="questions">
                    <h3>Question {{forloop.counter}}</h3>
                    <p>{{question.description}}</p>
                    <form method="post"  enctype="multipart/form-data">
                        {% csrf_token %}
                        <!-- all the questions and form stuff -->

                        <button type="submit">Submit Hunt</button>
                    </form>
                </section>
            {%empty%}
                <p>Ther eare no questions in this quiz...</p>
            {%endfor%}
        </div>

    </main>

    <!-- Clock -->
    <script>
        function updateClock() {
            const currentTime = new Date();

            const formattedTime =
                currentTime.toLocaleTimeString("en-AU", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                });

            document.getElementById("clock").textContent =
                formattedTime.toUpperCase();
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
